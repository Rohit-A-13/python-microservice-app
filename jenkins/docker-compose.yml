version: "3.9"
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-local
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - C:/Users/Rohit/.kube:/root/.kube
    networks:
      - jenkins-net
networks:
  jenkins-net:
volumes:
  jenkins_home: